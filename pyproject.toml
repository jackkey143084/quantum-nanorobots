[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qnrs"
version = "0.2.0"
description = "Quantum Nanorobot Runtime — unified API layer for quantum instruments (Qiskit, Silq, PennyLane, Labber, QCoDeS, ROS 2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jackkeyburgess" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.14"]
ml = ["pennylane>=0.36"]
lab = ["qcodes>=0.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "httpx>=0.27", "websockets>=12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
all = [
    "qiskit>=1.0", "qiskit-aer>=0.14", "pennylane>=0.36", "qcodes>=0.40",
    "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "httpx>=0.27", "websockets>=12",
]

[project.scripts]
qnrs = "qnrs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qnrs.ros2" = ["**/*.msg", "**/*.srv", "**/*.xml", "**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
